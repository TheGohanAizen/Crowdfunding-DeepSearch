<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crowdfunding DeepSearch - Workspace Operations</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0}header{padding:26px 20px;text-align:center;background:#111827;border-bottom:1px solid #334155}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.panel{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:22px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.metric{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:14px}.metric strong{display:block;font-size:25px}.metric span{color:#94a3b8;font-size:12px}.workspace{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:16px;margin:12px 0}.workspace h3{margin:0 0 8px}.meta{color:#94a3b8;font-size:13px}.flags{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.flag{background:#172554;border:1px solid #1e40af;color:#bfdbfe;border-radius:16px;padding:5px 9px;font-size:12px}button{padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:white;font-weight:bold;cursor:pointer;margin:6px 6px 0 0}.notice{padding:12px;background:#172554;border:1px solid #1e40af;border-radius:8px;color:#bfdbfe}a{color:#93c5fd}
</style>
</head>
<body>
<header><h1>Crowdfunding DeepSearch</h1><p>Cross-Workspace Operations Dashboard</p></header>
<div class="wrap">
<div class="panel">
<div class="notice">Local operations view only. It reads existing browser tracking data and does not contact, post to, or submit anything. Private notes, response-detail text, and outreach draft bodies are never shown or exported here.</div>
<div class="grid" id="totals"></div>
<button type="button" onclick="refreshDashboard()">Refresh</button><button type="button" onclick="exportOperationsSummary()">Export privacy-safe summary</button>
</div>
<div class="panel"><h2>Campaign workspaces</h2><div id="workspaces"></div></div>
</div>
<script>
const TRACKING_PREFIX="crowdfunding-deepsearch:";
const REGISTRY_KEY="crowdfunding-deepsearch:workspace-registry";
function safeJson(raw,fallback){try{const value=JSON.parse(raw);return value&&typeof value==="object"?value:fallback}catch(e){return fallback}}
function registry(){return safeJson(localStorage.getItem(REGISTRY_KEY)||"{}",{})}
function recordsForWorkspace(id){const prefix=TRACKING_PREFIX+"campaign:"+id+":";const rows=[];for(let i=0;i<localStorage.length;i+=1){const key=localStorage.key(i);if(!key||!key.startsWith(prefix))continue;const record=safeJson(localStorage.getItem(key)||"{}",{});rows.push({key,kind:key.includes(":audience:")?"audience":"opportunity",record})}return rows}
function ever(record,status){return record&&((record.status===status)||(Array.isArray(record.history)&&record.history.some(x=>x&&x.status===status)))}
function summarizeWorkspace(id,profile){const rows=recordsForWorkspace(id);const now=Date.now();const summary={workspace_id:id,total:rows.length,audience:0,opportunities:0,saved:0,reviewed:0,contacted:0,responded:0,closed:0,followups_due:0,followups_overdue_24h:0,followups_upcoming_7d:0,drafts_prepared:0,submission_packets:0,permission_reviews:0};rows.forEach(({kind,record})=>{summary[kind==="audience"?"audience":"opportunities"]+=1;const status=record.status||"";if(Object.prototype.hasOwnProperty.call(summary,status))summary[status]+=1;if(record.outreach_draft)summary.drafts_prepared+=1;if(record.submission_packet&&record.submission_packet.prepared_at)summary.submission_packets+=1;if(record.permission_review&&record.permission_review.reviewed_at)summary.permission_reviews+=1;if(record.follow_up_at&&status!=="closed"){const t=new Date(record.follow_up_at).getTime();if(Number.isFinite(t)){if(t<=now){summary.followups_due+=1;if(now-t>=86400000)summary.followups_overdue_24h+=1}else if(t<=now+7*86400000)summary.followups_upcoming_7d+=1}}});summary.ever_reviewed=rows.filter(x=>ever(x.record,"reviewed")).length;summary.ever_contacted=rows.filter(x=>ever(x.record,"contacted")).length;summary.ever_responded=rows.filter(x=>ever(x.record,"responded")).length;summary.review_rate_percent=summary.total?Math.round(summary.ever_reviewed/summary.total*100):0;summary.contact_rate_percent=summary.ever_reviewed?Math.round(summary.ever_contacted/summary.ever_reviewed*100):0;summary.response_rate_percent=summary.ever_contacted?Math.round(summary.ever_responded/summary.ever_contacted*100):0;summary.profile={need:profile.need||"",location:profile.location||"",goal:profile.goal||"",updated_at:profile.updated_at||""};return summary}
function allSummaries(){const r=registry();return Object.keys(r).map(id=>summarizeWorkspace(id,r[id]||{})).sort((a,b)=>String(b.profile.updated_at).localeCompare(String(a.profile.updated_at)))}
function metric(label,value){return '<div class="metric"><strong>'+String(value)+'</strong><span>'+label+'</span></div>'}
function escapeHtml(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function refreshDashboard(){const summaries=allSummaries();const totals=summaries.reduce((a,s)=>{a.workspaces+=1;a.records+=s.total;a.audience+=s.audience;a.opportunities+=s.opportunities;a.due+=s.followups_due;a.overdue+=s.followups_overdue_24h;a.upcoming+=s.followups_upcoming_7d;a.responded+=s.ever_responded;return a},{workspaces:0,records:0,audience:0,opportunities:0,due:0,overdue:0,upcoming:0,responded:0});document.getElementById("totals").innerHTML=metric("Workspaces",totals.workspaces)+metric("Tracked records",totals.records)+metric("Audience leads",totals.audience)+metric("Institutional opportunities",totals.opportunities)+metric("Follow-ups due",totals.due)+metric("Overdue 24h+",totals.overdue)+metric("Upcoming 7 days",totals.upcoming)+metric("Ever responded",totals.responded);const box=document.getElementById("workspaces");if(!summaries.length){box.innerHTML='<div class="notice">No saved campaign workspaces were found in this browser yet.</div>';return}box.innerHTML=summaries.map(s=>'<div class="workspace"><h3>'+escapeHtml([s.profile.need,s.profile.location].filter(Boolean).join(" · ")||"Untitled campaign")+'</h3><div class="meta">Workspace '+escapeHtml(s.workspace_id)+(s.profile.updated_at?' · updated '+escapeHtml(new Date(s.profile.updated_at).toLocaleString()):'')+'</div><div class="flags"><span class="flag">'+s.total+' tracked</span><span class="flag">'+s.audience+' audience</span><span class="flag">'+s.opportunities+' opportunities</span><span class="flag">'+s.followups_due+' due</span><span class="flag">'+s.followups_overdue_24h+' overdue</span><span class="flag">'+s.followups_upcoming_7d+' upcoming</span><span class="flag">'+s.response_rate_percent+'% response rate</span></div></div>').join("")}
function exportOperationsSummary(){const payload={version:1,kind:"crowdfunding-deepsearch-workspace-operations-summary",exported_at:new Date().toISOString(),workspaces:allSummaries(),privacy:{private_notes_included:false,response_details_included:false,outreach_draft_bodies_included:false,recipient_addresses_included:false}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"});const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download="crowdfunding-deepsearch-workspace-operations-summary.json";link.click();URL.revokeObjectURL(url)}
refreshDashboard();
</script>
</body>
</html>
