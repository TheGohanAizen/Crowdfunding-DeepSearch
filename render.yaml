services:
  - type: web
    name: crowdfunding-deepsearch-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python3 -m py_compile backend/server.py backend/protected_app.py backend/smoke_test.py"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT backend.protected_app:app"
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: MAX_SOURCE_CHECKS
        value: "8"
      - key: MAX_DISCOVERY_RESULTS
        value: "25"
      - key: GOOGLE_CSE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
