services:
  - type: web
    name: crowdfunding-deepsearch-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python3 -m py_compile backend/server.py backend/protected_app.py backend/smoke_test.py && python3 backend/smoke_test.py"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT backend.protected_app:app"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGIN
        value: "https://crowdfunding-deepsearch.onrender.com"
      - key: MAX_SOURCE_CHECKS
        value: "8"
      - key: MAX_DISCOVERY_RESULTS
        value: "25"
      - key: MAX_SEARCH_LANES
        value: "4"
      - key: MAX_RESULTS_PER_LANE
        value: "4"
      - key: SEARCH_PROVIDER
        value: auto
      - key: TAVILY_API_KEY
        sync: false
      - key: GOOGLE_CSE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
      - key: AUTOMATION_ADMIN_ENDPOINTS_ENABLED
        value: "false"
      - key: AUTOMATION_STORAGE_PERSISTENT
        value: "false"
      - key: AUTOMATION_OPERATIONAL_TOOLS_ENABLED
        value: "false"
      - key: AUTOMATION_STORAGE_BACKEND
        value: "sqlite"
