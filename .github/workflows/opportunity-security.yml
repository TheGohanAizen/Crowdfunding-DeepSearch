name: Opportunity Security Tests

on:
  push:
    paths:
      - "backend/opportunity_*.py"
      - "backend/test_opportunity_*.py"
      - "backend/smoke_test.py"
      - ".github/workflows/opportunity-security.yml"
  pull_request:
    paths:
      - "backend/opportunity_*.py"
      - "backend/test_opportunity_*.py"
      - "backend/smoke_test.py"
      - ".github/workflows/opportunity-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile offline opportunity modules
        run: |
          python - <<'PY'
          import glob, py_compile
          paths = glob.glob("opportunity_*.py") + glob.glob("test_opportunity_*.py")
          assert paths, "No opportunity modules found"
          for path in paths:
              py_compile.compile(path, doraise=True)
          PY
      - name: Run all offline opportunity security tests
        run: python -m unittest discover -v -s . -p "test_opportunity_*.py"
