name: Opportunity Security Tests

on:
  push:
    paths:
      - "backend/opportunity_*.py"
      - "backend/test_opportunity_*.py"
      - "backend/smoke_test.py"
      - ".github/workflows/opportunity-security.yml"
  pull_request:
    paths:
      - "backend/opportunity_*.py"
      - "backend/test_opportunity_*.py"
      - "backend/smoke_test.py"
      - ".github/workflows/opportunity-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile offline opportunity modules
        run: |
          python - <<'PY'
          import glob, py_compile
          paths = glob.glob("opportunity_*.py") + glob.glob("test_opportunity_*.py")
          assert paths, "No opportunity modules found"
          for path in paths:
              py_compile.compile(path, doraise=True)
          PY
      - name: Run all offline opportunity security tests
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover(
              start_dir=".", pattern="test_opportunity_*.py"
          )
          count = suite.countTestCases()
          print(f"Discovered {count} opportunity security tests", flush=True)
          if count == 0:
              raise SystemExit("ERROR: No opportunity security tests discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
