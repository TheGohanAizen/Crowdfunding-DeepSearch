name: Opportunity Security Tests

on:
  push:
    paths:
      - "backend/opportunity_*.py"
      - "backend/test_opportunity_*.py"
      - "backend/smoke_test.py"
      - ".github/workflows/opportunity-security.yml"
  pull_request:
    paths:
      - "backend/opportunity_*.py"
      - "backend/test_opportunity_*.py"
      - ".github/workflows/opportunity-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run all offline opportunity security tests
        run: python -m unittest discover -v -s . -p "test_opportunity_*.py"
