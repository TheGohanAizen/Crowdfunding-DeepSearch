name: Verify Production Deployment

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-deployment-verification
  cancel-in-progress: false

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render and verify exact commit
        id: verify
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          PRODUCTION_URL: https://crowdfunding-deepsearch.onrender.com
        run: |
          set +e
          python3 - <<'PY'
          import json, os, time, urllib.request

          base = os.environ["PRODUCTION_URL"].rstrip("/")
          expected = os.environ["EXPECTED_COMMIT"].lower()
          attempts = 30
          delay = 15

          def read_json(path):
              req = urllib.request.Request(
                  base + path,
                  headers={"User-Agent": "CrowdfundingDeepSearch-GitHubDeploymentVerifier/1.0"},
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  return json.loads(response.read().decode("utf-8"))

          for attempt in range(1, attempts + 1):
              try:
                  deployment = read_json("/api/deployment")
                  live = str(deployment.get("commit") or "").lower()
                  print(f"Attempt {attempt}/{attempts}: live={live or 'unknown'} expected={expected}")
                  if live == expected:
                      health = read_json("/api/health")
                      if health.get("status") == "ok":
                          print("Exact commit is live and healthy.")
                          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                              out.write("verified=true\n")
                              out.write(f"live_commit={live}\n")
                          raise SystemExit(0)
              except Exception as exc:
                  print(f"Attempt {attempt}/{attempts}: {exc}")
              if attempt < attempts:
                  time.sleep(delay)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("verified=false\n")
          raise SystemExit(1)
          PY
          code=$?
          exit $code

      - name: Record successful deployment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const body = [
              "✅ Production deployment verified",
              "",
              `Commit: \`${sha}\``,
              "Health: ok",
              "Verification: exact Render deployment commit matched GitHub commit.",
              "Search credits: 0 (discovery endpoint was not called).",
              `Verified: ${new Date().toISOString()}`
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body
            });

      - name: Record failed deployment verification
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const body = [
              "❌ Production deployment verification failed",
              "",
              `Expected commit: \`${sha}\``,
              "The verifier did not confirm this exact commit as live and healthy within the verification window.",
              "Search credits: 0 (discovery endpoint was not called).",
              `Checked: ${new Date().toISOString()}`
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body
            });
